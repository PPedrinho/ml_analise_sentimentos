<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de sentimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --ink: #14213d; --muted: #5b6785; --line: #d5dbe8;
    --pos: #1f9d63; --neg: #d6455d; --neu: #7a869f; --accent: #2b4acb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1424; --card: #172036; --ink: #e8ecf8; --muted: #93a0c0; --line: #2a3555;
            --pos: #3ccb8a; --neg: #ff7088; --neu: #9aa6c2; --accent: #7e97ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; line-height: 1.05; }
  .sub { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  label { font-weight: 600; font-size: .95rem; }
  textarea {
    width: 100%; min-height: 110px; margin: 10px 0 14px; padding: 12px 14px; resize: vertical;
    font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count { color: var(--muted); font-size: .85rem; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; padding: 11px 20px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #result { margin-top: 20px; display: none; }
  #result.show { display: block; }
  .verdict { font-size: clamp(2.4rem, 10vw, 3.6rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin: 0 0 14px; }
  .meter { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: .9rem; }
  .quote { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
  .error { color: var(--neg); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>O que esse comentário diz?</h1>
  <p class="sub">Escreva um comentário sobre um produto e o modelo classifica o sentimento.</p>

  <section class="card">
    <label for="texto">Comentário</label>
    <textarea id="texto" maxlength="1000" placeholder="Ex.: Adorei o produto, excelente qualidade!"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 1000</span>
      <button id="btn" type="button">Analisar sentimento</button>
    </div>

    <div id="result" aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <div class="meter"><div class="fill" id="fill"></div></div>
      <div class="meta"><span>Confiança</span><span id="conf"></span></div>
      <p class="quote" id="quote"></p>
    </div>
  </section>
</main>

<script>
  // Se abrir o arquivo direto (file://), aponta para a API local; se vier da API, usa o mesmo endereço.
  const API_URL = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
  const COLORS = { positivo: "var(--pos)", negativo: "var(--neg)", neutro: "var(--neu)" };

  const $ = (id) => document.getElementById(id);
  const texto = $("texto"), btn = $("btn"), result = $("result");

  texto.addEventListener("input", () => { $("count").textContent = texto.value.length + " / 1000"; });

  btn.addEventListener("click", analisar);
  texto.addEventListener("keydown", (e) => { if (e.ctrlKey && e.key === "Enter") analisar(); });

  async function analisar() {
    const valor = texto.value.trim();
    if (valor.length < 3) return mostrarErro("Escreva pelo menos 3 caracteres.");

    btn.disabled = true;
    btn.textContent = "Analisando...";
    try {
      const resp = await fetch(API_URL + "/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto: valor }),
      });
      if (!resp.ok) throw new Error("A API respondeu com erro " + resp.status + ".");
      mostrar(await resp.json());
    } catch (err) {
      mostrarErro(err instanceof TypeError
        ? "Não consegui falar com a API. Ela está rodando em http://127.0.0.1:8000?"
        : err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Analisar sentimento";
    }
  }

  function mostrar(d) {
    const cor = COLORS[d.sentimento] || "var(--accent)";
    const pct = Math.round(d.confianca * 100);
    $("verdict").textContent = d.sentimento.charAt(0).toUpperCase() + d.sentimento.slice(1);
    $("verdict").style.color = cor;
    $("fill").style.background = cor;
    $("fill").style.width = "0";
    $("conf").textContent = pct + "%";
    $("quote").textContent = "“" + d.texto + "”";
    $("quote").classList.remove("error");
    result.classList.add("show");
    requestAnimationFrame(() => requestAnimationFrame(() => { $("fill").style.width = pct + "%"; }));
  }

  function mostrarErro(msg) {
    result.classList.add("show");
    $("verdict").textContent = "";
    $("fill").style.width = "0";
    $("conf").textContent = "";
    $("quote").textContent = msg;
    $("quote").classList.add("error");
  }
</script>
</body>
</html>
